name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - script.js
      - .nojekyll
      - r1.mp4
      - raven-logo.png
      - config/includes.chroot/usr/share/backgrounds/raven/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static website
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            index.html
            styles.css
            script.js
            .nojekyll
            r1.mp4
            raven-logo.png
            config/includes.chroot/usr/share/backgrounds/raven/raven-dark-3840x2160.jpg
            config/includes.chroot/usr/share/backgrounds/raven/raven-default-1920x1080.jpg
            config/includes.chroot/usr/share/backgrounds/raven/raven-default-2560x1440.jpg
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required website file is missing: $file" >&2
              exit 1
            fi
          done

          mkdir -p _site/config/includes.chroot/usr/share/backgrounds/raven
          cp index.html styles.css script.js .nojekyll r1.mp4 raven-logo.png _site/
          cp config/includes.chroot/usr/share/backgrounds/raven/* \
            _site/config/includes.chroot/usr/share/backgrounds/raven/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
